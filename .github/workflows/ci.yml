name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  AHL_CORE_REF: v0.4.0

# `ahl-core` is a path dependency (`../ahl-core`), so every job checks out this crate and the
# core side by side and runs cargo from the crate directory. The core is a private repository:
# the read-only deploy key `AHL_CORE_DEPLOY_KEY` (added 2026-09-04) authenticates the checkout.
# `AHL_CORE_REF` MUST move together with the `ahl-core` version requirement in Cargo.toml.
defaults:
  run:
    working-directory: ahl-mirror

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The lint policy lives in Cargo.toml [lints]; pedantic, nursery and cargo stay at warn there
      # and are raised by `-D warnings` here.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ahl-mirror
      - run: cargo test --all-targets

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ahl-mirror
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz:
    name: Fuzz build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ahl-mirror
            ahl-mirror/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Build only. Compiling and linking the nine targets against the library on every pull
      # request is what keeps them from silently rotting out of step with the API they call;
      # running a campaign is not a gate, and its length is not a property of a pull request.
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ahl-mirror
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # `src/bin/` is the server's process wiring (config load, socket bind, graceful
      # shutdown) exercised by hand, not by unit tests; every behavioural rule lives in the
      # library and is covered there. Mirrors ahl-core's convention for its own `src/bin/`.
      - name: Generate coverage
        run: cargo llvm-cov --all-features --ignore-filename-regex 'src/bin/' --fail-under-lines 90

  msrv:
    name: MSRV (1.92.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahl-mirror
      - uses: actions/checkout@v4
        with:
          repository: evidentum-io/ahl-core
          ref: ${{ env.AHL_CORE_REF }}
          ssh-key: ${{ secrets.AHL_CORE_DEPLOY_KEY }}
          path: ahl-core
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ahl-mirror
      - run: cargo check
